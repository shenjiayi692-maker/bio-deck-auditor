<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Bio/MedTech Deck Auditor workflow</title>
  <desc id="desc">Five stages connect deck ingestion, atomic claim extraction, primary-source verification, human review, and report export. Evidence status remains separate from risk severity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#82928A"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="26" fill="#F7F5F0"/>
  <text x="54" y="42" dominant-baseline="hanging" font-family="Georgia, Times New Roman, serif" font-size="40" font-weight="700" fill="#123B30">From narrative to an auditable decision</text>
  <text x="54" y="94" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#5A6A63">Each step preserves the page, entity, product, time, jurisdiction, and source behind a claim.</text>

  <g fill="none" stroke="#82928A" stroke-width="2" marker-end="url(#arrow)">
    <path d="M252 220H278"/>
    <path d="M473 220H499"/>
    <path d="M694 220H720"/>
    <path d="M915 220H941"/>
  </g>

  <g transform="translate(54 152)">
    <rect width="198" height="137" rx="16" fill="#FFFFFF" stroke="#CDD3CE"/>
    <text x="18" y="17" dominant-baseline="hanging" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800" fill="#0B7254">01 / INGEST</text>
    <text x="18" y="52" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#203B32">Read every page</text>
    <text x="18" y="86" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#64726C">Text · notes · charts</text>
    <text x="18" y="111" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#64726C">media · links</text>
  </g>
  <g transform="translate(275 152)">
    <rect width="198" height="137" rx="16" fill="#FFFFFF" stroke="#CDD3CE"/>
    <text x="18" y="17" dominant-baseline="hanging" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800" fill="#0B7254">02 / ATOMIZE</text>
    <text x="18" y="52" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#203B32">Build a ledger</text>
    <text x="18" y="86" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#64726C">One testable claim</text>
    <text x="18" y="111" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#64726C">per row</text>
  </g>
  <g transform="translate(496 152)">
    <rect width="198" height="137" rx="16" fill="#FFFFFF" stroke="#CDD3CE"/>
    <text x="18" y="17" dominant-baseline="hanging" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800" fill="#0B7254">03 / VERIFY</text>
    <text x="18" y="52" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#203B32">Check anchors</text>
    <text x="18" y="86" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#64726C">Trials · papers</text>
    <text x="18" y="111" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#64726C">patents · regulators</text>
  </g>
  <g transform="translate(717 152)">
    <rect width="198" height="137" rx="16" fill="#FFFFFF" stroke="#CDD3CE"/>
    <text x="18" y="17" dominant-baseline="hanging" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800" fill="#0B7254">04 / REVIEW</text>
    <text x="18" y="52" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#203B32">Review decisions</text>
    <text x="18" y="86" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#64726C">Confirm · clarify</text>
    <text x="18" y="111" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#64726C">revise · reject</text>
  </g>
  <g transform="translate(938 152)">
    <rect width="208" height="137" rx="16" fill="#103E32"/>
    <text x="18" y="17" dominant-baseline="hanging" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800" fill="#C7DFD6">05 / EXPORT</text>
    <text x="18" y="52" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Export the audit</text>
    <text x="18" y="86" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#C7D4CF">Markdown · PPTX</text>
    <text x="18" y="111" dominant-baseline="hanging" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#C7D4CF">questions · next checks</text>
  </g>

  <text x="54" y="326" dominant-baseline="hanging" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800" letter-spacing="1.2" fill="#4E6159">EVIDENCE STATE</text>
  <g transform="translate(54 360)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800">
    <rect width="173" height="38" rx="9" fill="#FFF0D5"/><text x="86.5" y="10" text-anchor="middle" dominant-baseline="hanging" fill="#986816">DECK ONLY</text>
    <g transform="translate(185 0)"><rect width="173" height="38" rx="9" fill="#ECECE6"/><text x="86.5" y="10" text-anchor="middle" dominant-baseline="hanging" fill="#606B66">CANDIDATE</text></g>
    <g transform="translate(370 0)"><rect width="173" height="38" rx="9" fill="#DDEFE7"/><text x="86.5" y="10" text-anchor="middle" dominant-baseline="hanging" fill="#0B7254">VERIFIED</text></g>
    <g transform="translate(555 0)"><rect width="173" height="38" rx="9" fill="#F6DFDA"/><text x="86.5" y="10" text-anchor="middle" dominant-baseline="hanging" fill="#A44C3D">CONTRADICTED</text></g>
    <g transform="translate(740 0)"><rect width="202" height="38" rx="9" fill="#E9E6F2"/><text x="101" y="10" text-anchor="middle" dominant-baseline="hanging" fill="#65578E">UNVERIFIABLE</text></g>
  </g>
  <text x="1014" y="368" dominant-baseline="hanging" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800" fill="#9A6B1E">RISK ≠ CONFIDENCE</text>
</svg>
